name: Capture Remont-EKT before edits

on:
  push:
    paths:
      - '.github/workflows/capture-remont.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture desktop and mobile
        run: |
          cat > /tmp/capture.cjs <<'EOF'
          const { chromium } = require('playwright');
          const target = 'https://stas5252.github.io/mockup-hub/mockups/remont-ekt/index.html';

          async function settle(page) {
            await page.goto(target, { waitUntil: 'networkidle', timeout: 120000 });
            await page.evaluate(async () => { if (document.fonts?.ready) await document.fonts.ready; });
            await page.evaluate(async () => {
              await new Promise(resolve => {
                let y = 0;
                const step = 700;
                const timer = setInterval(() => {
                  window.scrollBy(0, step);
                  y += step;
                  if (y >= document.body.scrollHeight) {
                    clearInterval(timer);
                    window.scrollTo(0, 0);
                    setTimeout(resolve, 800);
                  }
                }, 80);
              });
            });
            await page.waitForTimeout(1200);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const desktop = await browser.newContext({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            const dpage = await desktop.newPage();
            await settle(dpage);
            await dpage.screenshot({ path: 'remont-ekt-before-desktop.png', fullPage: true });
            await desktop.close();

            const mobile = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
            const mpage = await mobile.newPage();
            await settle(mpage);
            await mpage.screenshot({ path: 'remont-ekt-before-mobile.png', fullPage: true });
            await mobile.close();

            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          EOF
          node /tmp/capture.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: remont-ekt-before-ed91f396
          path: |
            remont-ekt-before-desktop.png
            remont-ekt-before-mobile.png
          if-no-files-found: error
