<style>
:root{
  --bg:#0a0a0a; --ink:#f4f0e8; --paper:#f1eee8; --paper2:#e9e4dc;
  --accent:#ff5b2e; --accent2:#ff754f; --muted:#aaa39b; --dark:#121212; --line:rgba(255,255,255,.16);
  --max:1180px; --pad:clamp(18px,4vw,46px); --radius:0px;
}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden} body.no-scroll{overflow:hidden}
a{color:inherit;text-decoration:none} button,input,textarea,select{font:inherit}.wrap{width:min(var(--max),100%);margin:auto;padding-inline:var(--pad)}
::selection{background:var(--accent);color:#fff}
.noise{pointer-events:none;position:fixed;z-index:999;inset:0;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E")}

/* header */
.header{position:fixed;z-index:100;inset:0 0 auto 0;display:flex;align-items:center;justify-content:space-between;padding:16px var(--pad);mix-blend-mode:difference;color:#fff;pointer-events:none}.logo,.menu-toggle{pointer-events:auto}.logo{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.logo-mark{width:31px;height:31px;border:1px solid currentColor;display:grid;place-items:center;font-weight:800}.logo-text{line-height:1.08}.logo-text b{display:block;font-size:12px}.logo-text span{font-size:8px;letter-spacing:.18em;color:#c5c5c5}.menu-toggle{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.48);background:rgba(0,0,0,.08);display:grid;place-items:center;color:white;cursor:pointer}.menu-toggle i,.menu-toggle i::before,.menu-toggle i::after{content:"";display:block;width:17px;height:1px;background:currentColor;position:relative;transition:.25s}.menu-toggle i::before{position:absolute;top:-5px}.menu-toggle i::after{position:absolute;top:5px}.menu-toggle.active i{background:transparent}.menu-toggle.active i::before{top:0;transform:rotate(45deg)}.menu-toggle.active i::after{top:0;transform:rotate(-45deg)}
.drawer{position:fixed;z-index:90;inset:0;background:#0b0b0b;transform:translateY(-105%);transition:transform .7s cubic-bezier(.76,0,.24,1);display:grid;grid-template-rows:1fr auto;padding:110px var(--pad) 28px}.drawer.open{transform:none}.drawer nav{display:flex;flex-direction:column;justify-content:center}.drawer nav a{font-size:clamp(42px,10vw,86px);font-weight:900;line-height:.9;letter-spacing:-.07em;text-transform:uppercase;padding:.12em 0;border-bottom:1px solid #2b2b2b;overflow:hidden}.drawer nav a span{display:inline-block;transition:transform .3s}.drawer nav a:hover span{transform:translateX(14px)}.drawer-foot{display:flex;justify-content:space-between;gap:20px;color:#8c8c8c;font-size:11px;text-transform:uppercase;letter-spacing:.12em}

/* shared */
.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.display{font-size:clamp(48px,12vw,120px);line-height:.82;letter-spacing:-.075em;text-transform:uppercase;margin:0;font-weight:900}.serif{font-family:Georgia,'Times New Roman',serif;font-weight:400;text-transform:none;letter-spacing:-.04em}.section{padding:clamp(72px,10vw,130px) 0}.light{background:var(--paper);color:#111}.dark{background:var(--bg);color:var(--ink)}.accent{color:var(--accent)}.divider{border-top:1px solid currentColor;opacity:.17}.reveal{opacity:0;transform:translateY(44px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}.reveal.on{opacity:1;transform:none}.magnetic{will-change:transform}

/* hero */
.hero{min-height:100svh;position:relative;isolation:isolate;display:flex;align-items:flex-end;overflow:hidden;background:#080808}.hero-media{position:absolute;inset:0;z-index:-3}.hero-media img{width:100%;height:100%;object-fit:cover;object-position:46% 20%;filter:grayscale(.08) contrast(1.08) brightness(.74);transform:scale(1.03)}.hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 5%,rgba(0,0,0,.2) 46%,#090909 94%),linear-gradient(90deg,rgba(0,0,0,.06),rgba(0,0,0,.42) 76%,rgba(0,0,0,.7))}.hero-orbit{position:absolute;right:-18vw;top:12vh;width:65vw;aspect-ratio:1;border:1px solid rgba(255,255,255,.14);border-radius:50%;z-index:-1;animation:orbit 20s linear infinite}.hero-orbit::after{content:"";position:absolute;width:8px;height:8px;background:var(--accent);border-radius:50%;top:13%;left:10%}@keyframes orbit{to{transform:rotate(360deg)}}
.hero-inner{width:100%;padding:120px var(--pad) 26px}.hero-label{margin-left:auto;width:max-content;text-align:right;font-size:10px;line-height:1.55;text-transform:uppercase;letter-spacing:.18em;color:#d6d0c9}.hero-title{margin-top:32vh;font-size:clamp(52px,15.5vw,170px);line-height:.75;letter-spacing:-.08em;font-weight:900;text-transform:uppercase;max-width:1100px}.hero-title span{display:block}.hero-title span:last-child{padding-left:11vw;color:#fff}.hero-bottom{display:grid;gap:24px;margin-top:26px}.hero-copy{font-family:Georgia,serif;font-size:clamp(20px,5.3vw,34px);line-height:1.12;max-width:540px}.hero-actions{display:flex;align-items:center;gap:18px;justify-content:flex-end}.round-cta{width:118px;height:118px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:#fff;border:0;cursor:pointer;position:relative;transition:transform .3s,background .3s}.round-cta:hover{transform:scale(1.06);background:var(--accent2)}.round-cta svg{width:28px}.round-cta::after{content:"СМОТРЕТЬ ШОУРИЛ";position:absolute;bottom:-28px;white-space:nowrap;font-size:8px;letter-spacing:.2em}.pill-cta{border:1px solid rgba(255,255,255,.46);padding:15px 18px;text-transform:uppercase;font-size:10px;letter-spacing:.13em;transition:.25s;background:rgba(0,0,0,.26)}.pill-cta:hover{background:#fff;color:#111}.scroll-cue{margin-top:56px;display:flex;align-items:center;justify-content:space-between;color:#7e7a75;font-size:9px;letter-spacing:.18em;text-transform:uppercase}.scroll-line{height:1px;background:#474747;flex:1;margin:0 16px;position:relative;overflow:hidden}.scroll-line::after{content:"";position:absolute;left:-30%;top:0;width:30%;height:1px;background:#fff;animation:slide 2.4s ease-in-out infinite}@keyframes slide{50%{left:100%}100%{left:100%}}
@media(min-width:800px){.hero-inner{padding-bottom:38px}.hero-title{margin-top:20vh}.hero-bottom{grid-template-columns:1fr 1fr;align-items:end}.hero-copy{max-width:460px}.hero-actions{justify-content:flex-start}.hero-media img{object-position:50% 20%}.round-cta{width:146px;height:146px}}

/* marquee */
.marquee{background:var(--accent);color:#090909;overflow:hidden;border-top:1px solid #090909;border-bottom:1px solid #090909}.marquee-track{display:flex;width:max-content;animation:marquee 24s linear infinite;padding:17px 0;font-size:clamp(18px,4vw,34px);font-weight:800;text-transform:uppercase;letter-spacing:-.03em}.marquee-track span{padding:0 24px}.marquee-track b{font-weight:400;font-family:Georgia,serif;font-style:italic}@keyframes marquee{to{transform:translateX(-50%)}}

/* about */
.about-head{display:grid;gap:28px;margin-bottom:52px}.about-head .display{max-width:900px}.about-copy{font-size:18px;line-height:1.6;max-width:680px}.about-grid{display:grid;gap:10px}.about-main{position:relative;min-height:560px;overflow:hidden;background:#111}.about-main img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;filter:grayscale(1)}.about-main::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.75))}.about-caption{position:absolute;z-index:2;left:20px;right:20px;bottom:20px;color:#fff;font-family:Georgia,serif;font-size:28px;line-height:1.05}.about-note{background:#131313;color:#fff;padding:30px;display:flex;flex-direction:column;justify-content:space-between;min-height:300px}.about-note p{font-family:Georgia,serif;font-size:26px;line-height:1.12;margin:30px 0}.about-note small{color:#878787;text-transform:uppercase;letter-spacing:.16em}.about-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#ccc}.about-meta div{background:var(--paper);padding:20px 12px}.about-meta strong{font-size:28px;display:block;letter-spacing:-.05em}.about-meta span{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#777}
@media(min-width:760px){.about-head{grid-template-columns:1.25fr .75fr;align-items:end}.about-grid{grid-template-columns:1.2fr .8fr}.about-meta{grid-column:1/-1}.about-main{min-height:760px}.about-note{min-height:760px}}

/* gallery */
.gallery-shell{margin-top:70px}.gallery-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:20px}.gallery-title{font-size:clamp(38px,9vw,92px);line-height:.88;margin:0;text-transform:uppercase;letter-spacing:-.06em}.gallery-count{font-family:Georgia,serif;font-size:24px;color:#7c7770}.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.gallery-item{position:relative;overflow:hidden;min-height:230px;background:#ddd;cursor:pointer}.gallery-item img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .4s}.gallery-item:hover img{transform:scale(1.045)}.gallery-item::after{content:attr(data-index);position:absolute;left:10px;bottom:10px;color:#fff;font-size:9px;letter-spacing:.15em;background:rgba(0,0,0,.32);padding:5px 7px}.gallery-item:nth-child(3),.gallery-item:nth-child(8){grid-column:1/-1;aspect-ratio:1.55}.gallery-item:not(:nth-child(3)):not(:nth-child(8)){aspect-ratio:.8}.gallery-more{margin-top:18px;width:100%;padding:17px;border:1px solid #111;background:transparent;text-transform:uppercase;letter-spacing:.15em;font-size:10px;cursor:pointer}.gallery-more:hover{background:#111;color:#fff}
@media(min-width:760px){.gallery-grid{grid-template-columns:repeat(4,1fr)}.gallery-item:nth-child(3){grid-column:3/5;grid-row:1/3;aspect-ratio:auto}.gallery-item:nth-child(8){grid-column:1/3;aspect-ratio:1.6}.gallery-item{min-height:310px}}
.lightbox{position:fixed;z-index:200;inset:0;background:rgba(0,0,0,.94);display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:.3s}.lightbox.open{opacity:1;pointer-events:auto}.lightbox img{max-width:min(980px,94vw);max-height:88vh;object-fit:contain}.lightbox-close{position:absolute;right:20px;top:20px;width:48px;height:48px;border:1px solid #555;background:transparent;color:#fff;font-size:24px;border-radius:50%;cursor:pointer}

/* showreel */
.showreel{position:relative;overflow:hidden}.show-grid{display:grid;gap:28px}.show-copy{align-self:end}.show-title{font-family:Georgia,serif;font-size:clamp(54px,13vw,130px);font-weight:400;line-height:.82;letter-spacing:-.06em;margin:0}.show-copy p{max-width:470px;color:#aba6a0;line-height:1.55}.video{position:relative;aspect-ratio:4/5;overflow:hidden;border:1px solid #262626}.video img{width:100%;height:100%;object-fit:cover;filter:contrast(1.08)}.video::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.6))}.video-center{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;background:rgba(255,91,46,.92);display:grid;place-items:center;transition:.3s}.video:hover .video-center{transform:translate(-50%,-50%) scale(1.08)}.video-center svg{width:30px}.video-time{position:absolute;z-index:2;right:16px;bottom:14px;font-size:10px;letter-spacing:.16em}.show-lines{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:#777}
@media(min-width:760px){.show-grid{grid-template-columns:.75fr 1.25fr;align-items:start}.video{aspect-ratio:16/10}}

/* quiz */
.quiz-wrap{display:grid;gap:30px}.quiz-intro{position:sticky;top:100px;align-self:start}.quiz-intro .display{font-size:clamp(50px,10vw,105px)}.quiz-box{background:#111;border:1px solid #292929;min-height:570px;padding:clamp(20px,4vw,42px);position:relative}.progress{display:flex;gap:5px;margin-bottom:36px}.progress i{display:block;height:2px;background:#343434;flex:1;transition:.3s}.progress i.on{background:var(--accent)}.q-page{display:none;animation:qIn .45s ease both}.q-page.active{display:block}@keyframes qIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}.q-step{font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:#6f6f6f}.q-title{font-size:clamp(30px,7vw,58px);line-height:.96;letter-spacing:-.05em;margin:10px 0 26px}.option-grid{display:grid;gap:8px}.choice{width:100%;padding:17px 16px;border:1px solid #363636;background:#111;color:#fff;text-align:left;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.22s}.choice:hover,.choice.selected{border-color:var(--accent);background:#17100e}.choice small{color:#777}.quiz-fields{display:grid;gap:10px}.quiz-fields input,.quiz-fields textarea,.quiz-fields select{width:100%;padding:16px 14px;background:#0b0b0b;border:1px solid #383838;color:#fff;outline:0}.quiz-fields input:focus,.quiz-fields textarea:focus,.quiz-fields select:focus{border-color:var(--accent)}.quiz-fields textarea{min-height:112px;resize:vertical}.q-nav{display:flex;gap:8px;margin-top:20px}.q-next,.q-back{padding:15px 18px;border:1px solid #404040;text-transform:uppercase;font-size:10px;letter-spacing:.14em;cursor:pointer}.q-next{background:var(--accent);border-color:var(--accent);color:#fff;flex:1}.q-back{background:transparent;color:#777}.consent{display:flex;gap:8px;align-items:flex-start;margin-top:12px;color:#777;font-size:10px;line-height:1.35}.gift-card{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center}.gift-thumb{width:56px;height:56px;border:1px solid #333;display:grid;place-items:center;font-family:Georgia,serif;font-size:20px;color:var(--accent)}
@media(min-width:860px){.quiz-wrap{grid-template-columns:.8fr 1.2fr;gap:70px}}

/* benefits */
.benefits-grid{display:grid;border-top:1px solid #bbb;border-left:1px solid #bbb;margin-top:38px}.benefit{border-right:1px solid #bbb;border-bottom:1px solid #bbb;padding:24px;min-height:240px;display:flex;flex-direction:column;justify-content:space-between}.benefit-num{font-size:10px;color:var(--accent);letter-spacing:.16em}.benefit h3{font-size:clamp(28px,7vw,50px);line-height:.92;letter-spacing:-.055em;margin:20px 0}.benefit p{font-size:14px;line-height:1.5;color:#666;margin:0}.benefit-arrow{align-self:flex-end;font-size:26px}.benefit:hover{background:#111;color:#fff}.benefit:hover p{color:#bbb}
@media(min-width:760px){.benefits-grid{grid-template-columns:repeat(2,1fr)}}

/* packages */
.package-list{margin-top:40px;border-top:1px solid #262626}.package{display:grid;gap:20px;padding:28px 0;border-bottom:1px solid #262626;transition:.3s}.package:hover{padding-left:8px}.package-top{display:flex;justify-content:space-between;gap:18px}.package h3{font-size:clamp(29px,7vw,58px);line-height:.95;letter-spacing:-.055em;text-transform:uppercase;margin:0}.package-price{font-size:13px;text-transform:uppercase;letter-spacing:.11em;color:var(--accent);white-space:nowrap}.package p{color:#a7a29c;line-height:1.55;margin:0;max-width:690px}.package ul{padding:0;margin:0;list-style:none;display:grid;gap:8px;color:#ddd;font-size:13px}.package li::before{content:"—";color:var(--accent);margin-right:9px}.package-action{width:max-content;border:1px solid #4b4b4b;background:transparent;color:#fff;padding:12px 16px;text-transform:uppercase;letter-spacing:.13em;font-size:9px;cursor:pointer}.package-action:hover{background:var(--accent);border-color:var(--accent)}
@media(min-width:860px){.package{grid-template-columns:.9fr 1.2fr .45fr;align-items:start}.package-action{justify-self:end;align-self:end}}

/* reviews */
.reviews{overflow:hidden}.reviews .wrap{overflow:hidden}.review-top{display:flex;align-items:end;justify-content:space-between;gap:20px}.review-controls{display:flex;gap:6px}.review-controls button{width:42px;height:42px;border-radius:50%;border:1px solid #aaa;background:transparent;font-size:20px;cursor:pointer}.review-track{display:flex;transition:transform .6s cubic-bezier(.2,.7,.2,1);margin-top:36px}.review-card{min-width:100%;padding-right:8vw}.review-card blockquote{font-family:Georgia,serif;font-size:clamp(27px,6.4vw,54px);line-height:1.12;letter-spacing:-.04em;margin:0}.review-person{margin-top:28px;display:flex;align-items:center;gap:12px}.avatar{width:50px;height:50px;border-radius:50%;overflow:hidden;background:#ddd}.avatar img{width:100%;height:100%;object-fit:cover}.person-meta b{display:block;font-size:12px}.person-meta span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#777}.review-dots{margin-top:24px;display:flex;gap:8px}.review-dots i{width:28px;height:2px;background:#bbb}.review-dots i.on{background:var(--accent)}

/* faq */
.faq-list{margin-top:34px;border-top:1px solid #c8c8c8}.faq-row{border-bottom:1px solid #c8c8c8}.faq-q{width:100%;padding:21px 0;background:transparent;border:0;text-align:left;display:grid;grid-template-columns:1fr auto;gap:20px;font-size:clamp(18px,4.5vw,28px);font-weight:700;cursor:pointer}.faq-q span:last-child{font-size:28px;font-weight:400;transition:.3s;color:var(--accent)}.faq-row.open .faq-q span:last-child{transform:rotate(45deg)}.faq-a{max-height:0;overflow:hidden;transition:max-height .5s ease,padding .5s ease;color:#5c5c5c;line-height:1.6;max-width:820px}.faq-row.open .faq-a{max-height:500px;padding-bottom:24px}

/* gift/footer */
.gift{position:relative;overflow:hidden}.gift-grid{display:grid;gap:30px}.gift-art{position:relative;min-height:480px;overflow:hidden}.gift-art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;filter:grayscale(1) brightness(.65)}.gift-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,#0a0a0a)}.gift-art p{position:absolute;z-index:2;left:22px;right:22px;bottom:22px;font-family:Georgia,serif;font-size:34px;line-height:1.02;margin:0}.gift-options{display:grid;gap:8px}.gift-option{border:1px solid #333;padding:18px;display:grid;grid-template-columns:1fr auto;gap:18px;cursor:pointer;transition:.2s}.gift-option:hover{border-color:var(--accent);transform:translateX(5px)}.gift-option b{font-size:17px}.gift-option span{color:var(--accent)}

.footer{padding:80px 0 34px;background:#050505}.footer-cta{font-size:clamp(58px,13vw,150px);line-height:.78;letter-spacing:-.08em;text-transform:uppercase;font-weight:900;margin:0}.footer-cta a{border-bottom:.08em solid var(--accent)}.footer-grid{display:grid;gap:30px;margin-top:70px;padding-top:24px;border-top:1px solid #292929}.footer-meta{color:#888;font-size:11px;line-height:1.7}.social-row{display:flex;gap:8px;flex-wrap:wrap}.social-row a{padding:10px 12px;border:1px solid #333;text-transform:uppercase;font-size:9px;letter-spacing:.12em}.legal{margin-top:56px;color:#555;font-size:9px;line-height:1.5;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

.floating{position:fixed;z-index:70;right:14px;bottom:14px;display:flex;gap:8px;align-items:center;transform:translateY(100px);opacity:0;transition:.35s}.floating.on{transform:none;opacity:1}.floating a{background:var(--accent);color:#fff;padding:13px 16px;border-radius:999px;text-transform:uppercase;font-size:9px;letter-spacing:.12em;box-shadow:0 8px 30px rgba(0,0,0,.35)}.floating button{width:42px;height:42px;border-radius:50%;border:1px solid #4a4a4a;background:#101010;color:#fff;cursor:pointer}

/* mobile tuning */
@media(max-width:560px){.hero-title{margin-top:38vh}.hero-actions{justify-content:space-between}.round-cta{width:100px;height:100px}.display{font-size:50px}.section{padding:74px 0}.about-main{min-height:510px}.gallery-item{min-height:210px}.review-card{padding-right:3vw}.footer-cta{font-size:58px}.drawer nav a{font-size:44px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

/* === stability + responsive pass 2026-09-22 === */
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{min-width:0}
section,footer{scroll-margin-top:72px}
.header{height:70px;padding:12px max(18px,var(--pad));background:#0a0a0a;color:#fff;mix-blend-mode:normal;border-bottom:1px solid rgba(255,255,255,.11)}
.logo{min-width:0}.logo-text{min-width:0}.logo-text b{white-space:nowrap}.menu-toggle{flex:0 0 44px;background:#0a0a0a;border-color:#4a4a4a}
.hero{min-height:100svh;padding-top:70px}
.hero-inner{padding-top:40px}
.hero-title{max-width:100%;overflow-wrap:normal;word-break:normal}
